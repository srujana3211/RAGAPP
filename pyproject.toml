[project]
name = "ragapp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "ipykernel>=7.4.0",
    "langchain>=1.4.6",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.12",
    "langchain-groq>=1.1.3",
    "pymupdf>=2.0",
    "pypdf>=6.21.1",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.1.0",
    "vectorstore>=0.0.0",
]

[project.scripts]
ragapp = "ragapp:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"
